<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motorcycle Tsunami Escape</title>
    <!-- Display font of the wave name tags; they fall back to Arial Black if it cannot load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@700&family=Montserrat:wght@800&display=swap" rel="stylesheet" />
    <!-- Pinned v1 build for production stability -->
    <script src="https://sdk.bloxity.io/v1/legion-sdk.min.js"></script>
    <script>
      // Show the splash once per tab. A reconnect-triggered document reload must not flash it again.
      try {
        const splashSeenKey = 'mte-loading-screen-seen';
        if (sessionStorage.getItem(splashSeenKey)) {
          document.documentElement.classList.add('skip-initial-loading');
        } else {
          sessionStorage.setItem(splashSeenKey, '1');
        }
      } catch {}
    </script>
    <!-- Loading screen: plain HTML so it paints before the game's scripts have even arrived; the game fades it
         out once everything is loaded (see src/ui/loadingScreen.js). Sizes follow the 1920 x 1001 reference
         layout, scaled by --u to fit any screen. -->
    <style>
      #loading-screen {
        --u: min(calc(100vw / 1920), calc(100vh / 1001));
        position: fixed; inset: 0; z-index: 1000; overflow: hidden; background: #0d1a14;
        font-family: "Segoe UI", "Helvetica Neue", Roboto, Arial, sans-serif;
        transition: opacity 0.45s ease; }
      .skip-initial-loading #loading-screen { display: none; }
      #loading-screen.loading-screen--done { opacity: 0; pointer-events: none; }
      /* The blurred art, standing still. */
      #loading-screen .loading-bg {
        position: absolute; inset: 0;
        background: url(/loading/background.jpg) center / cover no-repeat; }
      /* Panel content flows in a column, so on small screens (where the minimum sizes below take over)
         everything still fits; on desktop it lands exactly on the reference layout. */
      #loading-screen .loading-panel {
        --icon: max(calc(256 * var(--u)), 112px);
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -48%); box-sizing: border-box;
        width: max(calc(1124 * var(--u)), min(92vw, 420px));
        padding: calc(var(--icon) / 2 + 36 * var(--u)) 16px calc(37 * var(--u));
        display: flex; flex-direction: column; align-items: center;
        background: rgba(31, 34, 38, 0.76); border-radius: max(calc(8 * var(--u)), 6px); }
      #loading-screen .loading-icon {
        position: absolute; left: 50%; top: calc(var(--icon) / -2); transform: translateX(-50%);
        width: var(--icon); height: var(--icon); border-radius: max(calc(10 * var(--u)), 8px); }
      #loading-screen .loading-title, #loading-screen .loading-creator {
        margin: 0; max-width: 100%; text-align: center; line-height: 1.25; }
      #loading-screen .loading-title { font-size: max(calc(28 * var(--u)), 16px); font-weight: 600; color: #eaeaeb; }
      #loading-screen .loading-creator {
        margin-top: max(calc(36 * var(--u)), 8px); font-size: max(calc(16 * var(--u)), 12px); font-weight: 400; color: #caccd2; }
      #loading-screen .loading-status {
        position: absolute; left: 0; right: 0; bottom: calc(8 * var(--u)); text-align: center;
        font-size: max(calc(11 * var(--u)), 10px); color: #d1d4d9; }
    </style>
  </head>
  <body style="margin:0; overflow:hidden; background:#000;">
    <div id="loading-screen" role="status" aria-label="Loading Speed Motorcycle Tsunami Escape">
      <div class="loading-bg"></div>
      <div class="loading-panel">
        <img class="loading-icon" src="/loading/icon.jpg" alt="" />
        <h1 class="loading-title">Speed Motorcycle Tsunami Escape</h1>
        <p class="loading-creator">TwistPlay</p>
      </div>
      <div class="loading-status">Joining server</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
